<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>羅定邦中學 教師發展日 - 中秋歷奇大挑戰</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        .header-gradient {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        }
        .accent-gradient {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }
        .card-shadow {
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05), 0 2px 6px -1px rgba(0, 0, 0, 0.02);
        }
        .animate-fade-in {
            animation: fadeIn 0.25s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Custom Modal Backdrop Overlay */
        .modal-overlay {
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 pb-12 flex flex-col items-center">

    <header class="w-full header-gradient text-white shadow-md sticky top-0 z-30">
        <div class="max-w-md mx-auto px-4 py-3.5 text-center">
            <div class="flex items-center justify-center space-x-2 mb-1">
                <i class="fa-solid fa-moon text-amber-400 text-lg"></i>
                <h1 class="text-base font-bold tracking-wide">羅定邦中學 教師發展日</h1>
            </div>
            <p class="text-xs text-slate-300 font-medium">Law Ting Pong Secondary School · TDD</p>
            <div class="mt-2 inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30 text-xs font-medium">
                <span>🥮 中秋跨學科歷奇大挑戰</span>
            </div>
            <div id="userInfo" class="text-xs text-amber-200 mt-2 font-semibold hidden flex justify-between items-center bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700">
                <span id="userText"><i class="fa-solid fa-users text-amber-400 mr-1"></i> --</span>
                <button onclick="confirmResetGroup()" class="text-slate-400 hover:text-red-400 text-xs underline focus:outline-none">
                    切換組別
                </button>
            </div>
        </div>
    </header>

    <main class="w-full max-w-md px-4 mt-4 flex-grow">

        <!-- 1. 登入視窗 LOGIN VIEW -->
        <div id="loginView" class="bg-white rounded-2xl p-5 card-shadow border border-slate-100 animate-fade-in space-y-4">
            <div class="text-center pb-2 border-b border-slate-100">
                <div class="w-12 h-12 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-2 text-amber-600 text-xl">
                    <i class="fa-solid fa-flag-checkered"></i>
                </div>
                <h2 class="text-lg font-bold text-slate-800">隊伍登入 / Group Login</h2>
                <p class="text-xs text-slate-500 mt-0.5">請選擇您的分配組別並輸入隊長姓名</p>
            </div>

            <div>
                <label for="groupSelect" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    請選擇組別 / Select Group：
                </label>
                <select id="groupSelect" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm font-medium text-slate-800 focus:ring-2 focus:ring-amber-500 focus:bg-white focus:outline-none transition-all">
                    <option value="">-- 請選擇組別 / Select --</option>
                    <option value="1">第 1 組 / Group 1</option>
                    <option value="2">第 2 組 / Group 2</option>
                    <option value="3">第 3 組 / Group 3</option>
                    <option value="4">第 4 組 / Group 4</option>
                    <option value="5">第 5 組 / Group 5</option>
                    <option value="6">第 6 組 / Group 6</option>
                    <option value="7">第 7 組 / Group 7</option>
                    <option value="8">第 8 組 / Group 8</option>
                    <option value="9">第 9 組 / Group 9</option>
                    <option value="10">第 10 組 / Group 10</option>
                    <option value="11">第 11 組 / Group 11</option>
                    <option value="12">第 12 組 / Group 12</option>
                </select>
            </div>

            <div>
                <label for="leaderName" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">
                    隊長姓名 / Leader Name：
                </label>
                <input type="text" id="leaderName" placeholder="例如: 陳大文 Teacher Chan" onkeydown="if(event.key === 'Enter') startAdventure()" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm font-medium text-slate-800 focus:ring-2 focus:ring-amber-500 focus:bg-white focus:outline-none transition-all">
            </div>

            <button onclick="startAdventure()" class="w-full accent-gradient text-white py-3 rounded-xl font-bold text-base shadow-lg shadow-amber-500/25 active:scale-[0.98] transition-transform flex items-center justify-center gap-2">
                <i class="fa-solid fa-compass"></i>
                <span>開始歷奇遊戲 Start Adventure</span>
            </button>
        </div>

        <!-- 2. 地圖與任務清單 MAIN LIST VIEW -->
        <div id="mainView" class="hidden space-y-3.5 animate-fade-in">
            <!-- 進度卡片 -->
            <div class="bg-gradient-to-r from-amber-500 to-amber-600 rounded-2xl p-4 text-white shadow-lg shadow-amber-500/20">
                <div class="flex justify-between items-center mb-2">
                    <div>
                        <span class="text-xs font-semibold uppercase tracking-wider text-amber-100">挑戰總進度 Progress</span>
                        <h3 class="text-xl font-black"><span id="completedCount">0</span> / <span id="totalCount">12</span> 關</h3>
                    </div>
                    <div class="w-12 h-12 bg-white/10 rounded-full flex items-center justify-center text-2xl">
                        🏆
                    </div>
                </div>
                <!-- Progress Bar -->
                <div class="w-full bg-black/20 rounded-full h-2.5 overflow-hidden p-0.5">
                    <div id="progressBar" class="bg-white h-full rounded-full transition-all duration-500 ease-out" style="width: 0%"></div>
                </div>
            </div>

            <!-- 分流路線提示 -->
            <div class="bg-amber-50 border border-amber-200/80 rounded-xl p-3 flex gap-3 items-start text-xs text-amber-900 shadow-sm">
                <i class="fa-solid fa-map-location-dot text-amber-600 text-base mt-0.5 shrink-0"></i>
                <div class="leading-relaxed">
                    <strong>📍 第 <span id="routeGroupNum" class="text-amber-700 font-bold underline"></span> 組專屬路線已設定！</strong>
                    <p class="text-amber-800/90 mt-0.5">系統已根據組別完成自動分流，請由上至下依序前往關卡挑戰！</p>
                </div>
            </div>

            <!-- 任務篩選標籤 -->
            <div class="flex bg-slate-200/70 p-1 rounded-xl text-xs font-bold text-slate-600">
                <button id="filterAll" onclick="setFilter('all')" class="flex-1 py-1.5 rounded-lg text-center bg-white text-slate-800 shadow-sm transition-all">全部 (All)</button>
                <button id="filterPending" onclick="setFilter('pending')" class="flex-1 py-1.5 rounded-lg text-center transition-all">進行中 (Pending)</button>
                <button id="filterDone" onclick="setFilter('done')" class="flex-1 py-1.5 rounded-lg text-center transition-all">已完成 (Done)</button>
            </div>

            <!-- 站點卡片列表 -->
            <div id="cpList" class="space-y-2.5">
                <!-- Checkpoints dynamic injection -->
            </div>
        </div>

        <!-- 3. 任務詳細頁面 DETAIL VIEW -->
        <div id="detailView" class="hidden bg-white rounded-2xl p-5 card-shadow border border-slate-100 animate-fade-in space-y-4">
            <button onclick="showMain()" class="inline-flex items-center text-xs font-bold text-slate-500 hover:text-slate-800 bg-slate-100 px-3 py-1.5 rounded-lg transition-colors">
                <i class="fa-solid fa-arrow-left mr-1.5"></i> 返回任務清單 Back to List
            </button>

            <div class="border-b border-slate-100 pb-3">
                <span id="cpSubject" class="inline-block px-2.5 py-0.5 bg-amber-100 text-amber-800 font-bold text-xs rounded-md mb-1.5"></span>
                <h2 id="cpTitle" class="text-lg font-black text-slate-800"></h2>
            </div>

            <!-- 題目描述區 -->
            <div id="cpDesc" class="text-sm text-slate-700 leading-relaxed bg-slate-50 p-3.5 rounded-xl border border-slate-200/60"></div>

            <!-- Step 1: 解鎖碼 -->
            <div class="bg-amber-50/60 p-3.5 rounded-xl border border-amber-200/70 space-y-2">
                <label for="stationCodeInput" class="block text-xs font-bold text-amber-900 flex items-center justify-between">
                    <span>🔑 步驟一：輸入站點解鎖碼 (Station Code)</span>
                    <span class="text-[10px] text-amber-700 font-normal">查閱現場海報</span>
                </label>
                <input type="text" id="stationCodeInput" placeholder="請輸入海報上的解鎖碼 (例如: MOON1)" class="w-full bg-white border border-amber-300 rounded-lg px-3 py-2 text-sm font-mono font-bold uppercase text-slate-800 tracking-wider focus:ring-2 focus:ring-amber-500 focus:outline-none">
            </div>

            <!-- Step 2: 答題或上傳 -->
            <div id="verificationArea" class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 space-y-2">
                <!-- Dynamically populated per checkpoint type -->
            </div>

            <button id="submitBtn" onclick="submitChallenge()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold text-base shadow-lg shadow-emerald-600/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                <i class="fa-solid fa-paper-plane"></i>
                <span>提交答案完成本站 Submit</span>
            </button>
        </div>

    </main>

    <!-- CUSTOM ALERT MODAL -->
    <div id="customModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay hidden">
        <div class="bg-white rounded-2xl max-w-xs w-full p-5 text-center card-shadow animate-fade-in space-y-3 border border-slate-100">
            <div id="modalIconContainer" class="w-12 h-12 rounded-full flex items-center justify-center mx-auto text-2xl">
                <!-- Icon injected -->
            </div>
            <h3 id="modalTitle" class="text-base font-bold text-slate-800"></h3>
            <p id="modalMessage" class="text-xs text-slate-600 leading-relaxed whitespace-pre-line"></p>
            <button onclick="closeModal()" class="w-full bg-slate-900 text-white py-2.5 rounded-xl font-bold text-xs hover:bg-slate-800 transition-colors">
                明白 / OK
            </button>
        </div>
    </div>

    <!-- CONFIRM RESET MODAL -->
    <div id="confirmResetModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 modal-overlay hidden">
        <div class="bg-white rounded-2xl max-w-xs w-full p-5 text-center card-shadow animate-fade-in space-y-3">
            <div class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 class="text-base font-bold text-slate-800">確認切換組別？</h3>
            <p class="text-xs text-slate-600">切換組別將重新加載專屬路線，已完成的答題進度將保留在裝置中。</p>
            <div class="flex gap-2 pt-1">
                <button onclick="executeResetGroup()" class="flex-1 bg-red-600 text-white font-bold text-xs py-2.5 rounded-xl">切換組別</button>
                <button onclick="closeConfirmResetModal()" class="flex-1 bg-slate-100 text-slate-700 font-bold text-xs py-2.5 rounded-xl">取消</button>
            </div>
        </div>
    </div>

    <script>
        // 12 個關卡數據配置
        const checkpoints = [
            { id: 1, name: "CP01 中秋詩詞飛花令", code: "MOON1", subject: "中文科 Chinese", desc: "詩句「海上升明月，____共此時」缺失的兩字是？<br><span class='text-xs text-slate-500'>Fill in the missing two words: '海上升明月，____共此時'</span>", type: "text", answer: "天涯" },
            { id: 2, name: "CP02 Alphabet Mooncake", code: "LUNAR2", subject: "英文科 English", desc: "在白板寫下 5 個以 <b>M, O, O, N, S</b> 開頭的中秋英文單字並全組合照。<br><span class='text-xs text-slate-500'>Write 5 Mid-Autumn words starting with M,O,O,N,S on whiteboard & take a group photo.</span>", type: "media" },
            { id: 3, name: "CP03 港式中秋集體回憶", code: "HERI3", subject: "CSD 公社科", desc: "香港大坑中秋節最具特色的國家級非物質文化遺產活動名稱是？（三字）<br><span class='text-xs text-slate-500'>What is the famous 3-character Tai Hang Mid-Autumn heritage event in HK?</span>", type: "text", answer: "舞火龍" },
            { id: 4, name: "CP04 月餅供求曲線", code: "ECON5", subject: "經濟科 Economics", desc: "當月餅原料價格上漲，供給曲線會向「左」還是「右」移動？<br><span class='text-xs text-slate-500'>When raw material prices rise, does the supply curve shift 'Left' or 'Right'?</span>", type: "text", answer: "左" },
            { id: 5, name: "CP05 西班牙語中秋", code: "SPAN6", subject: "西班牙語 Spanish", desc: "西班牙語中「El farol」的意思是什麼？（提示：與中秋有關，兩字）<br><span class='text-xs text-slate-500'>What does 'El farol' mean in Spanish? (Hint: Related to Mid-Autumn, 2 words in Chinese)</span>", type: "text", answer: "燈籠" },
            { id: 6, name: "CP06 影子長度與高度角", code: "SCI8", subject: "科學科 Science", desc: "中秋夜月亮升至正空中最高點時，人的影子長度最「長」還是最「短」？<br><span class='text-xs text-slate-500'>When the moon reaches its highest point in the sky, is your shadow 'Long' or 'Short'?</span>", type: "text", answer: "短" },
            { id: 7, name: "CP07 熱量卡路里計算", code: "NUTRI9", subject: "家政/生物 Home Econ & Bio", desc: "吃半個雙黃月餅(400kcal)，若跑步每分鐘消耗 10kcal，需跑步多少分鐘？（請填純數字）<br><span class='text-xs text-slate-500'>Half a mooncake is 400kcal. Running burns 10kcal/min. How many minutes to burn it off?</span>", type: "text", answer: "40" },
            { id: 8, name: "CP08 數字密碼鏈", code: "LOGIC10", subject: "數學科 Math", desc: "推算數列：8, 15, 24, 35, ? 的下一個數字是？（填數字）<br><span class='text-xs text-slate-500'>Find the next number in sequence: 8, 15, 24, 35, ?</span>", type: "text", answer: "48" },
            { id: 9, name: "CP09 神話定格劇", code: "DRAMA13", subject: "表演藝術 Performing Arts", desc: "全組維持「嫦娥奔月」或「後羿射日」的定格姿勢 3 秒拍照。<br><span class='text-xs text-slate-500'>Freeze pose as 'Chang'e Flying to Moon' or 'Hou Yi Shooting Suns' & take a photo.</span>", type: "media" },
            { id: 10, name: "CP10 月下影子戲", code: "SHADOW14", subject: "視藝科 Visual Arts", desc: "利用燈光在牆上投影出至少 2 隻「玉兔」的手影拍照。<br><span class='text-xs text-slate-500'>Create at least 2 Jade Rabbit hand shadows on the wall and take a photo.</span>", type: "media" },
            { id: 11, name: "CP11 乒乓球規例", code: "BALL16", subject: "體育科 Physical Edu", desc: "乒乓球（象徵圓月）標準比賽每局先得幾分者獲勝？（填純數字）<br><span class='text-xs text-slate-500'>How many points win a standard Table Tennis game? (Enter number)</span>", type: "text", answer: "11" },
            { id: 12, name: "CP12 中秋燈謎解密", code: "RIDDLE20", subject: "中文 + 體育 Chin & PE", desc: "燈謎：「靜夜思」（打一四字成語）。<br><span class='text-xs text-slate-500'>Chinese Riddle: 'Thoughts in the Quiet Night' (4-character idiom).</span>", type: "text", answer: "有機可乘" }
        ];


        // 🎯 嵌入 Google Apps Script Web App URL
        const GAS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwhmGSMWg7-bTOZ46A_QZGdi35kTwMpD06oI2IFNA-gTy3P4uHJiwZFvyX4Idmg24nb/exec";

        // Safe LocalStorage Access Helper (Prevents iframe DOMException crashes)
        function safeGetStorage(key, defaultValue = '') {
            try {
                const item = localStorage.getItem(key);
                return item !== null ? item : defaultValue;
            } catch (e) {
                console.warn('localStorage access denied or unavailable:', e);
                return defaultValue;
            }
        }

        function safeSetStorage(key, value) {
            try {
                localStorage.setItem(key, value);
            } catch (e) {
                console.warn('localStorage write failed:', e);
            }
        }

        let currentGroup = safeGetStorage('cp_group', '');
        let currentLeader = safeGetStorage('cp_leader', '');
        let completedCPs = [];
        try {
            const rawCPs = safeGetStorage('cp_completed', '[]');
            completedCPs = JSON.parse(rawCPs);
            if (!Array.isArray(completedCPs)) completedCPs = [];
        } catch (e) {
            completedCPs = [];
        }
        let activeCPId = null;
        let sortedCheckpoints = [];
        let currentFilter = 'all';

        // 頁面加載初始化
        window.onload = function() {
            if (currentGroup && currentLeader) {
                showMain();
            } else {
                showLogin();
            }
        };

        // 12 組對應 12 個 CP 的專屬對稱分流（第 N 組從 CP N 開始循環）
        function getSortedRoute(groupNum) {
            const startId = parseInt(groupNum);
            const startIndex = checkpoints.findIndex(cp => cp.id === startId);
            if (startIndex === -1) return checkpoints;
            return [...checkpoints.slice(startIndex), ...checkpoints.slice(0, startIndex)];
        }

        function showLogin() {
            document.getElementById('loginView').classList.remove('hidden');
            document.getElementById('mainView').classList.add('hidden');
            document.getElementById('detailView').classList.add('hidden');
            document.getElementById('userInfo').classList.add('hidden');
        }

        function startAdventure() {
            const g = document.getElementById('groupSelect').value;
            const l = document.getElementById('leaderName').value.trim();
            if (!g || !l) {
                showModal('請補充資料', '請選擇組別及輸入隊長姓名！\nPlease select group and enter leader name!', 'warning');
                return;
            }
            currentGroup = g;
            currentLeader = l;
            safeSetStorage('cp_group', g);
            safeSetStorage('cp_leader', l);
            showMain();
        }

        function showMain() {
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('detailView').classList.add('hidden');
            document.getElementById('mainView').classList.remove('hidden');
            
            const userInfoEl = document.getElementById('userInfo');
            userInfoEl.classList.remove('hidden');
            document.getElementById('userText').innerHTML = `<i class="fa-solid fa-users text-amber-400 mr-1"></i>第 <b>${currentGroup}</b> 組 | 隊長: <b>${currentLeader}</b>`;
            
            document.getElementById('completedCount').innerText = completedCPs.length;
            document.getElementById('totalCount').innerText = checkpoints.length;
            
            // 計算進度條百分比
            const percent = Math.round((completedCPs.length / checkpoints.length) * 100);
            document.getElementById('progressBar').style.width = `${percent}%`;
            
            document.getElementById('routeGroupNum').innerText = currentGroup;
            
            sortedCheckpoints = getSortedRoute(parseInt(currentGroup));
            renderCPList();
        }

        function setFilter(filter) {
            currentFilter = filter;
            ['All', 'Pending', 'Done'].forEach(f => {
                const btn = document.getElementById(`filter${f}`);
                if (f.toLowerCase() === filter) {
                    btn.className = "flex-1 py-1.5 rounded-lg text-center bg-white text-slate-800 font-bold shadow-sm transition-all";
                } else {
                    btn.className = "flex-1 py-1.5 rounded-lg text-center text-slate-500 transition-all hover:text-slate-700";
                }
            });
            renderCPList();
        }

        function renderCPList() {
            const listEl = document.getElementById('cpList');
            listEl.innerHTML = '';
            
            let filtered = sortedCheckpoints.filter(cp => {
                const isDone = completedCPs.includes(cp.id);
                if (currentFilter === 'pending') return !isDone;
                if (currentFilter === 'done') return isDone;
                return true;
            });

            if (filtered.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-8 text-slate-400 text-xs bg-white rounded-xl border border-slate-100">
                        <i class="fa-solid fa-inbox text-2xl mb-1 text-slate-300 block"></i>
                        暫無相關關卡
                    </div>
                `;
                return;
            }
            
            filtered.forEach((cp) => {
                const isDone = completedCPs.includes(cp.id);
                const orderIndex = sortedCheckpoints.findIndex(item => item.id === cp.id) + 1;

                const card = document.createElement('div');
                card.className = `p-3.5 rounded-xl border transition-all cursor-pointer flex justify-between items-center bg-white ${
                    isDone 
                    ? 'border-emerald-200 bg-emerald-50/30' 
                    : 'border-slate-200 hover:border-amber-400 hover:shadow-md'
                }`;
                card.onclick = () => openDetail(cp.id);

                card.innerHTML = `
                    <div class="space-y-0.5">
                        <div class="flex items-center gap-2">
                            <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-100 text-slate-600 font-mono">
                                站點 ${orderIndex}
                            </span>
                            <span class="text-xs font-bold ${isDone ? 'text-emerald-800' : 'text-slate-800'}">
                                ${cp.name}
                            </span>
                        </div>
                        <div class="text-[11px] font-medium text-slate-500">
                            ${cp.subject}
                        </div>
                    </div>
                    <div>
                        ${isDone 
                            ? `<span class="inline-flex items-center text-xs font-bold text-emerald-700 bg-emerald-100 px-2.5 py-1 rounded-full border border-emerald-200">
                                <i class="fa-solid fa-circle-check mr-1"></i> 已完成
                               </span>`
                            : `<span class="inline-flex items-center text-xs font-bold text-amber-700 bg-amber-50 px-2.5 py-1 rounded-full border border-amber-200">
                                挑戰 <i class="fa-solid fa-chevron-right ml-1 text-[10px]"></i>
                               </span>`
                        }
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        function openDetail(id) {
            activeCPId = id;
            const cp = checkpoints.find(item => item.id === id);
            
            document.getElementById('mainView').classList.add('hidden');
            document.getElementById('detailView').classList.remove('hidden');
            
            document.getElementById('cpTitle').innerText = cp.name;
            document.getElementById('cpSubject').innerText = cp.subject;
            document.getElementById('cpDesc').innerHTML = cp.desc;
            document.getElementById('stationCodeInput').value = "";

            const area = document.getElementById('verificationArea');
            if (cp.type === 'media') {
                area.innerHTML = `
                    <label class="block text-xs font-bold text-slate-700 mb-1">
                        📷 步驟二：拍攝或上傳相片 (Upload Photo)
                    </label>
                    <input type="file" id="mediaInput" accept="image/*" class="block w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-amber-100 file:text-amber-800 hover:file:bg-amber-200 cursor-pointer" onchange="previewMedia(event)">
                    <div id="mediaPreview" class="mt-2"></div>
                `;
            } else {
                area.innerHTML = `
                    <label class="block text-xs font-bold text-slate-700 mb-1">
                        ✏️ 步驟二：輸入驗證答案 (Enter Answer)
                    </label>
                    <input type="text" id="textInput" placeholder="在此輸入答案 Enter answer here" class="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-sm font-medium text-slate-800 focus:ring-2 focus:ring-amber-500 focus:outline-none">
                `;
            }
        }

        function previewMedia(e) {
            const file = e.target.files[0];
            if (file) {
                const preview = document.getElementById('mediaPreview');
                const url = URL.createObjectURL(file);
                preview.innerHTML = `<img src="${url}" class="max-h-48 rounded-xl mx-auto border border-slate-200 shadow-sm object-cover">`;
            }
        }

        function compressImage(file) {
            return new Promise((resolve, reject) => {
                if (!file) {
                    reject(new Error("No file selected"));
                    return;
                }
                const reader = new FileReader();
                reader.onerror = () => reject(new Error("FileReader error"));
                reader.onload = (e) => {
                    const img = new Image();
                    img.onerror = () => reject(new Error("Image loading error"));
                    img.onload = () => {
                        try {
                            const canvas = document.createElement('canvas');
                            let width = img.width;
                            let height = img.height;
                            const max_size = 800;
                            if (width > height) {
                                if (width > max_size) { height = Math.round(height * (max_size / width)); width = max_size; }
                            } else {
                                if (height > max_size) { width = Math.round(width * (max_size / height)); height = max_size; }
                            }
                            canvas.width = width;
                            canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            resolve(canvas.toDataURL('image/jpeg', 0.5));
                        } catch (err) {
                            reject(err);
                        }
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function submitChallenge() {
            // 保障機制：確保當前組別與隊長名稱正確讀取
            if (!currentGroup) currentGroup = safeGetStorage('cp_group', '');
            if (!currentLeader) currentLeader = safeGetStorage('cp_leader', '');

            const cp = checkpoints.find(item => item.id === activeCPId);
            if (!cp) return;

            const inputCode = document.getElementById('stationCodeInput').value.trim().toUpperCase();

            // 1. 校對站點解鎖碼
            if (inputCode !== cp.code) {
                showModal('解鎖碼錯誤', '❌ 解鎖碼不正確！\n請確認你已親臨該 Checkpoint 觀看海報！', 'error');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            let answerVal = "";
            let fileDataVal = "";
            let cleanBase64 = "";
            let fileNameVal = "";
            let mimeTypeVal = "";

            // 2. 校對文字答案或照片上傳
            if (cp.type === 'text') {
                const val = document.getElementById('textInput').value.trim();
                if (val.replace(/\s+/g, '').toUpperCase() !== cp.answer.replace(/\s+/g, '').toUpperCase()) {
                    showModal('答案不正確', '❌ 答案不正確，請重新思考！\nIncorrect answer. Please try again!', 'error');
                    return;
                }
                answerVal = val;
            } else {
                const fileInput = document.getElementById('mediaInput');
                if (!fileInput.files || fileInput.files.length === 0) {
                    showModal('缺少照片', '❌ 請拍攝或上傳照片存證！\nPlease upload a photo!', 'warning');
                    return;
                }
                const file = fileInput.files[0];
                submitBtn.disabled = true;
                submitBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> 正在處理照片...`;

                try {
                    fileDataVal = await compressImage(file);
                    // 關鍵修復：分離 Data URI 標頭，提供純 Base64 字串給 Utilities.base64Decode 使用
                    cleanBase64 = fileDataVal.includes(',') ? fileDataVal.split(',')[1] : fileDataVal;
                    fileNameVal = "LTPSS_G" + currentGroup + "_CP" + cp.id + "_" + Date.now() + ".jpg";
                    mimeTypeVal = "image/jpeg";
                    answerVal = "Photo Upload: " + fileNameVal;
                } catch (err) {
                    console.error("Image processing error:", err);
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> 提交答案完成本站 Submit`;
                    showModal('照片處理失敗', '❌ 讀取照片失敗，請重新選擇照片或重新拍攝！', 'error');
                    return;
                }
            }

            // 3. 提交至 Google Apps Script 雲端
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> 正在同步至雲端...`;

            // 相容性數據包：涵蓋所有常見後端變數名稱
            const payload = {
                group: currentGroup,
                groupNum: currentGroup,
                team: currentGroup,
                leader: currentLeader,
                leaderName: currentLeader,
                cpId: cp.id,
                cpName: cp.name,
                type: cp.type,
                answer: answerVal,
                fileData: cleanBase64,
                fileDataUrl: fileDataVal,
                base64: cleanBase64,
                photo: cleanBase64,
                image: cleanBase64,
                file: cleanBase64,
                attachment: cleanBase64,
                fileName: fileNameVal,
                filename: fileNameVal,
                mimeType: mimeTypeVal
            };

            // 使用 URLSearchParams 發送 POST Body，使 GAS e.parameter 可以直接抓取 Base64 數據
            const formBody = new URLSearchParams();
            for (const key in payload) {
                formBody.append(key, payload[key]);
            }
            formBody.append('payload', JSON.stringify(payload));

            try {
                if (GAS_SCRIPT_URL) {
                    await fetch(GAS_SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'
                        },
                        body: formBody.toString()
                    });
                }
            } catch (err) {
                console.warn("Cloud sync warning:", err);
            }

            // 紀錄本機進度
            if (!completedCPs.includes(activeCPId)) {
                completedCPs.push(activeCPId);
                safeSetStorage('cp_completed', JSON.stringify(completedCPs));
            }

            setTimeout(() => {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> 提交答案完成本站 Submit`;
                showModal('挑戰成功！', '🎉 恭喜完成本站挑戰！數據與相片已紀錄。', 'success');
                showMain();
            }, 800);
        }

        function showModal(title, message, type = 'info') {
            const modal = document.getElementById('customModal');
            const iconBox = document.getElementById('modalIconContainer');
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMessage').innerText = message;

            if (type === 'error') {
                iconBox.className = "w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto text-2xl";
                iconBox.innerHTML = '<i class="fa-solid fa-xmark"></i>';
            } else if (type === 'success') {
                iconBox.className = "w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-2xl";
                iconBox.innerHTML = '<i class="fa-solid fa-check"></i>';
            } else if (type === 'warning') {
                iconBox.className = "w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto text-2xl";
                iconBox.innerHTML = '<i class="fa-solid fa-exclamation"></i>';
            } else {
                iconBox.className = "w-12 h-12 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto text-2xl";
                iconBox.innerHTML = '<i class="fa-solid fa-info"></i>';
            }

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('customModal').classList.add('hidden');
        }

        function confirmResetGroup() {
            document.getElementById('confirmResetModal').classList.remove('hidden');
        }

        function closeConfirmResetModal() {
            document.getElementById('confirmResetModal').classList.add('hidden');
        }

        function executeResetGroup() {
            closeConfirmResetModal();
            currentGroup = '';
            currentLeader = '';
            safeSetStorage('cp_group', '');
            safeSetStorage('cp_leader', '');
            if (document.getElementById('groupSelect')) document.getElementById('groupSelect').value = '';
            if (document.getElementById('leaderName')) document.getElementById('leaderName').value = '';
            showLogin();
        }
    </script>
</body>
